<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Login - EyeAI</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;

            font-family: "Inter", sans-serif;

            color: #e8eef5;

            background:

                radial-gradient(
                    circle at 15% 15%,
                    rgba(53,220,255,0.10),
                    transparent 28%
                ),

                radial-gradient(
                    circle at 85% 80%,
                    rgba(82,125,255,0.10),
                    transparent 30%
                ),

                #05080d;

            overflow: hidden;
        }


        /* ================================
           BACKGROUND
           ================================= */

        .background-glow {

            position: fixed;

            width: 450px;

            height: 450px;

            border-radius: 50%;

            background: rgba(53,220,255,0.035);

            filter: blur(80px);

            pointer-events: none;
        }


        .glow-one {

            top: -200px;

            left: -150px;
        }


        .glow-two {

            bottom: -220px;

            right: -150px;

            background: rgba(82,125,255,0.04);
        }


        /* ================================
           LOGIN CONTAINER
           ================================= */

        .login-wrapper {

            width: 100%;

            max-width: 430px;

            position: relative;

            z-index: 2;
        }


        /* ================================
           BRAND
           ================================= */

        .brand {

            text-align: center;

            margin-bottom: 24px;
        }


        .brand-icon {

            width: 64px;

            height: 64px;

            margin: 0 auto 14px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 19px;

            font-size: 30px;

            background:
                linear-gradient(
                    135deg,
                    #2bd7ef,
                    #527dff
                );

            color: #031018;

            box-shadow:
                0 0 45px rgba(53,220,255,0.16);
        }


        .brand h1 {

            font-family:
                "Space Grotesk",
                sans-serif;

            font-size: 25px;

            letter-spacing: -0.8px;

            color: #f1f6fa;
        }


        .brand p {

            margin-top: 5px;

            color: #647387;

            font-size: 10px;

            text-transform: uppercase;

            letter-spacing: 2px;
        }


        /* ================================
           LOGIN CARD
           ================================= */

        .login-box {

            padding: 32px;

            border-radius: 22px;

            border:
                1px solid rgba(255,255,255,0.075);

            background:
                linear-gradient(
                    145deg,
                    rgba(16,25,38,0.94),
                    rgba(7,12,19,0.96)
                );

            box-shadow:
                0 30px 100px rgba(0,0,0,0.42);

            backdrop-filter: blur(20px);
        }


        .login-header {

            margin-bottom: 25px;
        }


        .login-header .eyebrow {

            color: #35dcff;

            font-size: 9px;

            font-weight: 700;

            letter-spacing: 1.8px;

            text-transform: uppercase;

            margin-bottom: 8px;
        }


        .login-header h2 {

            font-family:
                "Space Grotesk",
                sans-serif;

            font-size: 27px;

            letter-spacing: -1px;

            color: #edf4f8;
        }


        .login-header p {

            margin-top: 7px;

            color: #69788b;

            font-size: 11px;

            line-height: 1.6;
        }


        /* ================================
           ERROR
           ================================= */

        .error {

            margin-bottom: 18px;

            padding: 11px 13px;

            border-radius: 10px;

            border:
                1px solid rgba(255,91,108,0.18);

            background:
                rgba(255,91,108,0.055);

            color: #ff8792;

            font-size: 10px;

            line-height: 1.5;
        }


        /* ================================
           FORM
           ================================= */

        .form-group {

            margin-bottom: 18px;
        }


        label {

            display: block;

            margin-bottom: 7px;

            color: #8c9bad;

            font-size: 10px;

            font-weight: 600;

            letter-spacing: .3px;
        }


        .input-wrapper {

            position: relative;
        }


        input {

            width: 100%;

            height: 47px;

            padding:
                0 43px 0 14px;

            border:
                1px solid rgba(255,255,255,0.075);

            border-radius: 11px;

            outline: none;

            background:
                rgba(255,255,255,0.025);

            color: #e8eef5;

            font-family: "Inter", sans-serif;

            font-size: 11px;

            transition: .2s ease;
        }


        input::placeholder {

            color: #465466;
        }


        input:focus {

            border-color:
                rgba(53,220,255,0.38);

            background:
                rgba(53,220,255,0.025);

            box-shadow:
                0 0 0 3px
                rgba(53,220,255,0.055);
        }


        .input-icon {

            position: absolute;

            right: 14px;

            top: 50%;

            transform: translateY(-50%);

            color: #536377;

            font-size: 14px;

            pointer-events: none;
        }


        /* ================================
           PASSWORD BUTTON
           ================================= */

        .password-toggle {

            position: absolute;

            right: 10px;

            top: 50%;

            transform: translateY(-50%);

            width: 30px;

            height: 30px;

            border: none;

            background: transparent;

            color: #637286;

            cursor: pointer;

            font-size: 13px;

            padding: 0;
        }


        .password-toggle:hover {

            color: #35dcff;
        }


        /* ================================
           LOGIN BUTTON
           ================================= */

        .login-button {

            width: 100%;

            height: 47px;

            margin-top: 5px;

            border: none;

            border-radius: 11px;

            background:
                linear-gradient(
                    135deg,
                    #2bd7ef,
                    #527dff
                );

            color: #031018;

            font-family: "Inter", sans-serif;

            font-size: 11px;

            font-weight: 800;

            letter-spacing: .7px;

            cursor: pointer;

            transition:
                transform .2s ease,
                box-shadow .2s ease,
                opacity .2s ease;
        }


        .login-button:hover {

            transform: translateY(-1px);

            box-shadow:
                0 10px 30px
                rgba(53,220,255,0.15);
        }


        .login-button:active {

            transform: translateY(0);
        }


        .login-button.loading {

            opacity: .65;

            pointer-events: none;
        }


        /* ================================
           SECURITY
           ================================= */

        .security {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 7px;

            margin-top: 20px;

            padding-top: 18px;

            border-top:
                1px solid rgba(255,255,255,0.05);

            color: #536276;

            font-size: 9px;
        }


        .security-icon {

            color: #54dca4;

            font-size: 11px;
        }


        /* ================================
           FOOTER
           ================================= */

        .footer {

            text-align: center;

            margin-top: 18px;

            color: #3e4c5d;

            font-size: 8px;

            letter-spacing: .5px;
        }


        /* ================================
           RESPONSIVE
           ================================= */

        @media (max-width: 500px) {

            body {

                padding: 16px;
            }


            .login-box {

                padding: 25px 20px;

                border-radius: 18px;
            }


            .brand-icon {

                width: 56px;

                height: 56px;

                font-size: 26px;
            }


            .brand h1 {

                font-size: 22px;
            }


            .login-header h2 {

                font-size: 24px;
            }
        }

    </style>

</head>


<body>


<div class="background-glow glow-one"></div>

<div class="background-glow glow-two"></div>


<div class="login-wrapper">


    <!-- BRAND -->

    <div class="brand">

        <div class="brand-icon">
            👁
        </div>

        <h1>
            EyeAI
        </h1>

        <p>
            Administration Portal
        </p>

    </div>


    <!-- LOGIN CARD -->

    <div class="login-box">


        <div class="login-header">

            <div class="eyebrow">
                Secure Access
            </div>

            <h2>
                Administrator Login
            </h2>

            <p>
                Sign in to access the EyeAI
                administration dashboard.
            </p>

        </div>


        <!-- ERROR -->

        {% if error %}

            <div class="error">
                ⚠ {{ error }}
            </div>

        {% endif %}


        <!-- FORM -->

        <form
            method="POST"
            id="adminLoginForm"
        >


            <!-- USERNAME -->

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <div class="input-wrapper">

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter administrator username"
                        autocomplete="username"
                        required
                    >

                    <span class="input-icon">
                        👤
                    </span>

                </div>

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <div class="input-wrapper">

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter administrator password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        id="togglePassword"
                        aria-label="Show password"
                    >
                        👁
                    </button>

                </div>

            </div>


            <!-- LOGIN -->

            <button
                type="submit"
                class="login-button"
                id="loginButton"
            >
                SIGN IN TO ADMIN PANEL
            </button>


        </form>


        <!-- SECURITY -->

        <div class="security">

            <span class="security-icon">
                🔒
            </span>

            Authorized administrator access only

        </div>


    </div>


    <div class="footer">

        EyeAI • AI-assisted eye image analysis
        • Administration Panel

    </div>


</div>


<script>

    /* =========================================
       SHOW / HIDE PASSWORD
       ========================================= */

    const password =
        document.getElementById("password");

    const togglePassword =
        document.getElementById("togglePassword");


    togglePassword.addEventListener(
        "click",
        function () {

            if (
                password.type === "password"
            ) {

                password.type = "text";

                togglePassword.textContent = "🙈";

                togglePassword.setAttribute(
                    "aria-label",
                    "Hide password"
                );

            }

            else {

                password.type = "password";

                togglePassword.textContent = "👁";

                togglePassword.setAttribute(
                    "aria-label",
                    "Show password"
                );

            }

        }
    );


    /* =========================================
       LOGIN BUTTON LOADING
       ========================================= */

    const form =
        document.getElementById(
            "adminLoginForm"
        );

    const loginButton =
        document.getElementById(
            "loginButton"
        );


    form.addEventListener(
        "submit",
        function () {

            loginButton.classList.add(
                "loading"
            );

            loginButton.textContent =
                "AUTHENTICATING...";

        }
    );

</script>


</body>

</html>
